# The one CUBRID service definition for local work and the live test lane (#402).
#
# Persistent local CUBRID for manual development: `make docker-up`, `make docker-down`
# (keeps the data volume) and `make docker-clean` (deletes it). See CONTRIBUTING.md.
# Point `make integration-local` at it with CUBRID_HOST=127.0.0.1,
# CUBRID_PORT=$CUBRID_TEST_PORT, CUBRID_USER=dba, CUBRID_PASSWORD="" and CUBRID_DATABASE=demodb.
#
# `make integration` (scripts/run_integration.py) starts this same service as a
# run-owned project, `--project-name cubrid-mcp-it-<id>`, and always removes it with
# `down --volumes`; it never touches the default project that `make docker-up` uses.
services:
  cubrid:
    image: cubrid/cubrid:${CUBRID_VERSION:-11.4}
    environment:
      # The database the integration suite connects to.
      CUBRID_DB: demodb
      # A fixed server host name, so a recreated container can open the database
      # that an earlier one created on the volume.
      CUBRID_DB_HOST: localhost
    ports:
      # Broker only, on the loopback interface.
      - "127.0.0.1:${CUBRID_TEST_PORT:-33000}:33000"
    shm_size: 512m
    volumes:
      # Images up to 11.3 keep databases in /var/lib/cubrid, the 11.4 image in
      # /home/cubrid/CUBRID/databases; mount both so CUBRID_VERSION=11.2 also persists.
      - cubrid-data:/var/lib/cubrid
      - cubrid-databases:/home/cubrid/CUBRID/databases
    healthcheck:
      test: ["CMD-SHELL", "csql -u dba demodb -c 'SELECT 1;'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s

volumes:
  cubrid-data:
  cubrid-databases:
