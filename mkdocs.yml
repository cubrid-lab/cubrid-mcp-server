site_name: cubrid-mcp-server
site_description: Model Context Protocol server for CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/cubrid-mcp-server/
repo_url: https://github.com/cubrid-lab/cubrid-mcp-server
edit_uri: edit/main/docs/

theme:
  name: material
  # The development-documentation notice on every page (#355).
  custom_dir: docs/overrides
  # CUBRID Lab repository icon, pinned to an immutable cubrid-lab/brand commit.
  logo: https://raw.githubusercontent.com/cubrid-lab/brand/3a385be773af94077c56548a24cdb9313bdc3b5c/dist/icons/cubrid-mcp-server.svg
  favicon: https://raw.githubusercontent.com/cubrid-lab/brand/3a385be773af94077c56548a24cdb9313bdc3b5c/dist/icons/cubrid-mcp-server.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here:
      - Quick Start: quickstart.md
  - How-to guides:
      - Serve several databases: MULTI_CONNECTION.md
  - Reference:
      - Tools, resources and prompts: TOOLS.md
      - Configuration settings: https://github.com/cubrid-lab/cubrid-mcp-server#configure
      - Security Model: SECURITY_MODEL.md
  - Help:
      - Troubleshooting: TROUBLESHOOTING.md
      - Ask a question or report a bug: https://github.com/cubrid-lab/cubrid-mcp-server/issues/new/choose
      - Report a vulnerability privately: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/SECURITY.md#reporting-a-vulnerability
  - 한국어:
      - 한국어 README: README.ko.md
      - 여기서 시작:
          - 빠른 시작: ko/quickstart.md
      - 사용 방법:
          - 여러 데이터베이스 제공: ko/MULTI_CONNECTION.md
      - 참고:
          - 도구, 리소스, 프롬프트: ko/TOOLS.md
          - 설정 항목: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/docs/README.ko.md#설정
          - 보안 모델: ko/SECURITY_MODEL.md
      - 도움말:
          - 문제 해결: ko/TROUBLESHOOTING.md
          - 질문과 버그 제보: https://github.com/cubrid-lab/cubrid-mcp-server/issues/new/choose
          - 취약점 비공개 제보: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/SECURITY.md#reporting-a-vulnerability
  - Project:
      - Changelog: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite

exclude_docs: |
  overrides/

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

extra:
  # The commit this site is built from (#355). GitHub Actions sets GITHUB_SHA in
  # every job, so docs.yml needs no change; a local build leaves it empty and the
  # notice says that no commit was recorded.
  source_revision: !ENV [GITHUB_SHA, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/cubrid-mcp-server
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cubrid-mcp-server/
