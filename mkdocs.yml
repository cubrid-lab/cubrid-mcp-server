site_name: cubrid-mcp-server
site_description: Model Context Protocol server for CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/cubrid-mcp-server/
repo_url: https://github.com/cubrid-lab/cubrid-mcp-server
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quickstart.md
  - Usage:
      - Tools: TOOLS.md
      - Multi-Connection: MULTI_CONNECTION.md
  - Reference:
      - Security Model: SECURITY_MODEL.md
  - Operations:
      - Troubleshooting: TROUBLESHOOTING.md
  - Project:
      - Translations:
          - 한국어 README: README.ko.md
          - 한국어 문서:
              - 빠른 시작: ko/quickstart.md
              - 도구 참조: ko/TOOLS.md
              - 보안 모델: ko/SECURITY_MODEL.md
              - 멀티커넥션: ko/MULTI_CONNECTION.md
              - 문제 해결: ko/TROUBLESHOOTING.md
  - Changelog: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/CHANGELOG.md
  - Contributing: https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/cubrid-mcp-server
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cubrid-mcp-server/
