[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubrid-mcp-server"
dynamic = ["version"]
description = "Model Context Protocol server for CUBRID database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Gyeongjun Paik", email = "paikend@gmail.com"},
]
keywords = ["CUBRID", "database", "MCP", "Model Context Protocol", "LLM"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "fastmcp>=3.0,<4",
    "pycubrid>=1.4,<2",
    "sqlparse>=0.5,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff==0.16.3",
    "mypy==2.3.0",
    "pre-commit",
    "tox",
]

[project.scripts]
cubrid-mcp-server = "cubrid_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/cubrid-lab/cubrid-mcp-server"
Repository = "https://github.com/cubrid-lab/cubrid-mcp-server"
Issues = "https://github.com/cubrid-lab/cubrid-mcp-server/issues"

[tool.setuptools]
packages = ["cubrid_mcp_server"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "cubrid_mcp_server.__version__"}

[tool.setuptools.package-data]
cubrid_mcp_server = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's implicit defaults.
# Ruff expanded its default selection in 0.16 (59 -> 413 rules), which turns every
# routine ruff bump into a CI-breaking change unrelated to our own code. These four
# groups are exactly what ruff selected by default through 0.15.x.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["cubrid_mcp_server"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["cubrid_mcp_server"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb native -v -r fxX -p no:warnings"
python_files = "tests/*test_*.py"
markers = [
    "integration: tests that require a running CUBRID instance",
]
