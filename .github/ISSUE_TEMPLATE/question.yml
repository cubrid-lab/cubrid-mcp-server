name: Question
description: Ask a usage question about cubrid-mcp-server
title: "question: "
labels: ["question", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ask usage questions in this repository: how to install, configure,
        run or troubleshoot cubrid-mcp-server. Defects go in the Bug Report
        form and feature ideas in the Feature Request form; other
        repositories keep separate acceptance, assignees and closure.
        **House rules**
        - File this question in English.
        - Check the Troubleshooting guide first:
          https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/docs/TROUBLESHOOTING.md
        - Never paste passwords, connection strings or query results you
          would not publish.
        - Security reports do not belong in a public issue. Email them as
          described in SECURITY.md instead:
          https://github.com/cubrid-lab/cubrid-mcp-server/blob/main/SECURITY.md

  - type: markdown
    attributes:
      value: |
        Keep the `question:` title prefix and finish the title in English,
        for example `question: how do I serve two databases from one
        process`. You do not need to apply labels; maintainers assign
        priority and size after triage.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Server version, Python version, CUBRID version, OS, how the server is started (uvx / pipx / venv path / source, plus the client config `command`), and the MCP client used
      placeholder: |
        cubrid-mcp-server: 0.x.y
        Python: 3.12
        CUBRID: 11.4 (docker)
        Client: Claude Desktop
        Started via: uvx / pipx / .venv/bin/cubrid-mcp-server (plus the client config `command`)
        OS: macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what do you need to know?
      placeholder: Describe your question as concretely as you can
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What You Have Tried
      description: Optional. Steps you already took, documentation you followed, and what happened
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the question here
      placeholder: Config excerpts (redacted), error messages, links, etc.
    validations:
      required: false
