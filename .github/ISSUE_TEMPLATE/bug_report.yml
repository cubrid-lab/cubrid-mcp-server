name: Bug Report
description: Report a bug in cubrid-mcp-server
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `fix:` title prefix and finish the title in English, for example
        `fix: explain_query rejects SELECT with a leading comment`. You do not
        need to apply labels; maintainers assign priority and size after triage.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Server version, Python version, fastmcp/pycubrid versions, CUBRID version, and the MCP client used
      placeholder: |
        cubrid-mcp-server: 0.4.0
        Python: 3.12
        CUBRID: 11.4 (docker)
        Client: Claude Desktop
        OS: macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug
      placeholder: What is the bug about?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the bug here
      placeholder: Code snippets, error messages, logs, etc.
    validations:
      required: false
