name: Bug Report
description: Report a bug in cubrid-mcp-server
title: "bug: "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        File problems and implementation requests in the repository that owns
        the affected code or docs. Other repositories keep separate acceptance,
        assignees and closure; cross-repository links are references only.
        **House rules**
        - File this issue in English.
        - For DDL or parse errors, include the exact failing SQL and the result of running
          it directly on the server with `csql`.
        - Verify any claimed reserved word against the CUBRID keyword list before reporting it.
        - Include a runnable reproduction.

  - type: markdown
    attributes:
      value: |
        Keep the `bug:` title prefix and finish the title in English, for example
        `bug: explain_query rejects SELECT with a leading comment`. You do not
        need to apply labels; maintainers assign priority and size after triage.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Server version, Python version, fastmcp/pycubrid versions, CUBRID version, OS, how the server is started (uvx / pipx / venv path / source, plus the client config `command`), and the MCP client used
      placeholder: |
        cubrid-mcp-server: 0.x.y
        Python: 3.12
        CUBRID: 11.4 (docker)
        Client: Claude Desktop
        Started via: uvx / pipx / .venv/bin/cubrid-mcp-server (plus the client config `command`)
        OS: macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug
      placeholder: What is the bug about?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: sql-verification
    attributes:
      label: DDL / SQL error verification
      description: >-
        Optional, but required when the report involves a DDL or parse error. Paste the exact
        failing SQL and the output of running it directly with `csql` on the server.
        Reserved-word claims must be checked against the CUBRID keyword list.
      render: shell
    validations:
      required: false

  - type: textarea
    id: server-stderr-log
    attributes:
      label: Server stderr log (redacted)
      description: >-
        Optional. Paste a redacted excerpt of the server's stderr log. Remove
        host names, passwords, and SQL literals before pasting, and do not paste
        full SQL text. See docs/TROUBLESHOOTING.md in this repository for where
        to find the client's MCP log pane, or run the server manually and
        redirect stderr (for example, `2>server.log`).
      placeholder: |
        [Redacted stderr excerpt]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the bug here
      placeholder: Code snippets, error messages, logs, etc.
    validations:
      required: false
