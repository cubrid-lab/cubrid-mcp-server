name: Upstream Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  upstream-canary:
    name: Test against pycubrid@main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install --force-reinstall "git+https://github.com/cubrid-lab/pycubrid.git@main"
      - run: pytest -m "not integration" -q

  # Tracks the latest *stable* FastMCP release on PyPI (prereleases are
  # intentionally excluded; add `--pre` to the install step to widen this).
  # The runtime pin is fastmcp>=3.0,<5; this advisory canary surfaces upstream
  # breakage (including a future major beyond the pin) before release time.
  # Note: pip has no npm-style `pkg@latest` tag -- `fastmcp@latest` is parsed as
  # a direct-URL requirement and fails, so use --upgrade instead.
  fastmcp-canary:
    name: Test against fastmcp latest stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install --upgrade --force-reinstall fastmcp
      - name: Show resolved FastMCP version
        run: python -c "import importlib.metadata as m; print('fastmcp', m.version('fastmcp'))"
      - run: pytest -m "not integration" -q
