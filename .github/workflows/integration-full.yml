name: Integration Full Matrix

# Full Python × CUBRID compatibility matrix. Runs nightly, on demand, and as the
# release gate: release.yml calls it through workflow_call with the release
# commit SHA. PR CI only runs a reduced integration matrix, so this is the
# authoritative full-compatibility check gating a release.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "Full commit SHA to test (release.yml passes the release commit)"
        required: true
        type: string

# A release call gets its own group per SHA and is never cancelled; a nightly
# or manual run keeps the per-ref group that replaces an older pending run.
concurrency:
  group: integration-full-${{ inputs.sha && format('release-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.sha }}

permissions:
  contents: read

jobs:
  integration-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cubrid: ["10.2", "11.0", "11.2", "11.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start CUBRID container
        run: |
          docker run -d --name cubrid \
            --shm-size 512m \
            -e CUBRID_DB=demodb \
            -p 33000:33000 \
            -p 1523:1523 \
            cubrid/cubrid:${{ matrix.cubrid }}
          docker ps

      - name: Wait for CUBRID demodb to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec cubrid bash -lc "csql -u dba demodb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "CUBRID demodb is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID demodb... attempt $i"
            sleep 5
          done
          echo "CUBRID demodb did not become ready in time"
          docker logs cubrid || true
          exit 1

      - name: Pytest (integration)
        env:
          CUBRID_HOST: 127.0.0.1
          CUBRID_PORT: "33000"
          CUBRID_USER: dba
          CUBRID_PASSWORD: ""
          CUBRID_DATABASE: demodb
        run: pytest -m integration -v

      - name: CUBRID logs (on failure)
        if: failure()
        run: docker logs cubrid || true

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    needs: [integration-full]
    if: always()
    steps:
      - name: Require all matrix cells to pass
        run: |
          if [ "${{ needs.integration-full.result }}" != "success" ]; then
            echo "::error::Full compatibility matrix failed: ${{ needs.integration-full.result }}"
            exit 1
          fi
          echo "Full compatibility matrix passed."
