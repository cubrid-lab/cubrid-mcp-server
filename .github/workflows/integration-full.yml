name: Integration Full Matrix

# Python × CUBRID compatibility matrix (#223, #417).
#
#   release   publish-pypi.yml calls it through workflow_call with the release commit
#             SHA: always the full 4 × 4 matrix, fail-closed. PR and main CI only
#             run reduced lanes, so this is the authoritative full-compatibility
#             check gating a release.
#   weekly    Sunday 03:00 UTC: the full 4 × 4 matrix, plus the advisory
#             newest-stable CUBRID image check (latest-server). The Monday-Saturday
#             corners cron was removed (#417): its 15 runs (2026-10-08 to 10-24)
#             all passed, and its two cells are in every weekly and release run.
#   dispatch  manual: `scope` = full (default) or corners, plus latest-server.
#
# Every matrix cell records the image digest and engine version it ran.

on:
  schedule:
    - cron: "0 3 * * 0" # weekly full matrix
  workflow_dispatch:
    inputs:
      scope:
        description: "Matrix scope"
        required: false
        default: full
        type: choice
        options:
          - full
          - corners
  workflow_call:
    inputs:
      sha:
        description: "Full commit SHA to test (publish-pypi.yml passes the release commit)"
        required: true
        type: string

# A release call gets its own group per SHA and is never cancelled; a nightly
# or manual run keeps the per-ref group that replaces an older pending run.
concurrency:
  group: integration-full-${{ inputs.sha && format('release-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.sha }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan matrix scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select full matrix or corners
        id: plan
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
          DISPATCH_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail
          # Only a manual corners dispatch narrows; every schedule and a release
          # call (inputs.sha set) get the full matrix.
          scope=full
          if [ -z "$RELEASE_SHA" ] && [ "$EVENT" = "workflow_dispatch" ] \
            && [ "$DISPATCH_SCOPE" = "corners" ]; then
            scope=corners
          fi
          if [ "$scope" = "full" ]; then
            matrix='{"python-version":["3.11","3.12","3.13","3.14"],"cubrid":["10.2","11.0","11.2","11.4"]}'
          else
            matrix='{"include":[{"python-version":"3.11","cubrid":"10.2"},{"python-version":"3.14","cubrid":"11.4"}]}'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix scope: $scope"
          echo "$matrix"

  integration-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Install project and dev tools
        run: |
          uv pip install --system -e . --group dev
          uv pip freeze --system

      # Starts a run-owned cubrid/cubrid container, waits for demodb, runs
      # `pytest -m integration -v`, prints the container log on failure and always
      # removes the container (scripts/run_integration.py, #379).
      - name: Pytest (integration)
        run: make integration CUBRID_VERSION=${{ matrix.cubrid }}

      - name: Publish test results summary
        if: always()
        run: python3 scripts/report_results.py step-summary --results-dir test-results/integration --title "Integration tests (Python ${{ matrix.python-version }}, CUBRID ${{ matrix.cubrid }})" >> "$GITHUB_STEP_SUMMARY"

      # The exact image this cell ran (#417): its digest and cubrid_rel engine
      # version in the step summary. Evidence only; it never fails the cell.
      - name: Record CUBRID image
        if: always()
        run: python3 scripts/latest_server.py record --tag "${{ matrix.cubrid }}" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-integration-py${{ matrix.python-version }}-cubrid${{ matrix.cubrid }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, integration-full]
    if: always()
    steps:
      - name: Require all matrix cells to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          MATRIX_RESULT: ${{ needs.integration-full.result }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Matrix planning failed: $PLAN_RESULT"
            exit 1
          fi
          if [ -n "$RELEASE_SHA" ] && [ "$SCOPE" != "full" ]; then
            echo "::error::A release call must run the full matrix, got scope '$SCOPE'"
            exit 1
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Compatibility matrix ($SCOPE) failed: $MATRIX_RESULT"
            exit 1
          fi
          echo "Compatibility matrix ($SCOPE) passed."

  latest-server:
    # Weekly newest-stable CUBRID drift check (#417), advisory: never run by a
    # release call (inputs.sha is set there and github.event_name is the
    # caller's event), never a need of full-matrix-result, and continue-on-error,
    # so a failure shows on the run without failing it. scripts/latest_server.py
    # pulls `latest` and `11.4` once and compares digests and cubrid_rel. The same
    # digest starts no database; only a newer engine build behind `latest` gets a
    # canary of the live suite, on its immutable digest under a local tag. Nothing
    # here changes the supported versions or the release matrix.
    name: Newest CUBRID image (advisory)
    if: ${{ !inputs.sha && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Resolve latest and 11.4 images
        id: resolve
        run: |
          set -euo pipefail
          python3 scripts/latest_server.py resolve --date "$(date -u +%Y-%m-%dT%H:%MZ)" \
            --output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        if: steps.resolve.outputs.canary == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.resolve.outputs.canary == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Install project and dev tools
        if: steps.resolve.outputs.canary == 'true'
        run: |
          uv pip install --system -e . --group dev
          uv pip freeze --system

      - name: Run the advisory canary
        id: canary
        if: steps.resolve.outputs.canary == 'true'
        env:
          CANARY_IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          # make integration takes a cubrid/cubrid tag; a local tag pins the
          # resolved digest, so Compose starts exactly that image without a pull.
          docker tag "$CANARY_IMAGE" cubrid/cubrid:newest-canary
          make integration CUBRID_VERSION=newest-canary

      - name: Report newest CUBRID image result
        if: always()
        env:
          STATUS: ${{ steps.resolve.outputs.status }}
          CANARY_IMAGE: ${{ steps.resolve.outputs.image }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          python3 scripts/latest_server.py report --status "$STATUS" \
            --image "$CANARY_IMAGE" --outcome "$CANARY_OUTCOME" --summary "$GITHUB_STEP_SUMMARY"
