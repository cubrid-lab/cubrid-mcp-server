name: Integration Full Matrix

# Python × CUBRID compatibility matrix (#223).
#
#   release   release.yml calls it through workflow_call with the release commit
#             SHA: always the full 4 × 4 matrix, fail-closed. PR and main CI only
#             run reduced lanes, so this is the authoritative full-compatibility
#             check gating a release.
#   weekly    Sunday 03:00 UTC: the full 4 × 4 matrix.
#   corners   Monday-Saturday 03:00 UTC: oldest Python × oldest CUBRID and newest
#             Python × newest CUBRID, to catch compatibility drift between the
#             weekly runs without a daily 16-job Cartesian run.
#   dispatch  manual: `scope` = full (default) or corners.

on:
  schedule:
    - cron: "0 3 * * 0" # weekly full matrix
    - cron: "0 3 * * 1-6" # corners
  workflow_dispatch:
    inputs:
      scope:
        description: "Matrix scope"
        required: false
        default: full
        type: choice
        options:
          - full
          - corners
  workflow_call:
    inputs:
      sha:
        description: "Full commit SHA to test (release.yml passes the release commit)"
        required: true
        type: string

# A release call gets its own group per SHA and is never cancelled; a nightly
# or manual run keeps the per-ref group that replaces an older pending run.
concurrency:
  group: integration-full-${{ inputs.sha && format('release-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.sha }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan matrix scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select full matrix or corners
        id: plan
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DISPATCH_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          set -euo pipefail
          # Anything that is not explicitly a corners run gets the full matrix;
          # a release call (inputs.sha set) is always full.
          scope=full
          if [ -z "$RELEASE_SHA" ]; then
            if [ "$EVENT" = "schedule" ] && [ "$CRON" = "0 3 * * 1-6" ]; then
              scope=corners
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_SCOPE" = "corners" ]; then
              scope=corners
            fi
          fi
          if [ "$scope" = "full" ]; then
            matrix='{"python-version":["3.11","3.12","3.13","3.14"],"cubrid":["10.2","11.0","11.2","11.4"]}'
          else
            matrix='{"include":[{"python-version":"3.11","cubrid":"10.2"},{"python-version":"3.14","cubrid":"11.4"}]}'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix scope: $scope"
          echo "$matrix"

  integration-full:
    runs-on: ubuntu-latest
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start CUBRID container
        run: |
          docker run -d --name cubrid \
            --shm-size 512m \
            -e CUBRID_DB=demodb \
            -p 33000:33000 \
            -p 1523:1523 \
            cubrid/cubrid:${{ matrix.cubrid }}
          docker ps

      - name: Wait for CUBRID demodb to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec cubrid bash -lc "csql -u dba demodb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "CUBRID demodb is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID demodb... attempt $i"
            sleep 5
          done
          echo "CUBRID demodb did not become ready in time"
          docker logs cubrid || true
          exit 1

      - name: Pytest (integration)
        env:
          CUBRID_HOST: 127.0.0.1
          CUBRID_PORT: "33000"
          CUBRID_USER: dba
          CUBRID_PASSWORD: ""
          CUBRID_DATABASE: demodb
        run: pytest -m integration -v

      - name: CUBRID logs (on failure)
        if: failure()
        run: docker logs cubrid || true

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    needs: [plan, integration-full]
    if: always()
    steps:
      - name: Require all matrix cells to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          MATRIX_RESULT: ${{ needs.integration-full.result }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Matrix planning failed: $PLAN_RESULT"
            exit 1
          fi
          if [ -n "$RELEASE_SHA" ] && [ "$SCOPE" != "full" ]; then
            echo "::error::A release call must run the full matrix, got scope '$SCOPE'"
            exit 1
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Compatibility matrix ($SCOPE) failed: $MATRIX_RESULT"
            exit 1
          fi
          echo "Compatibility matrix ($SCOPE) passed."
