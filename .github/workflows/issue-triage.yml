name: Mark new issues for triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No automatic priority or size assignment: only enqueue new issues.
      - name: Require issue triage
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'status: needs triage'
