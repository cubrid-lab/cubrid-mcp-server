name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy cubrid_mcp_server

      - name: Pytest (unit)
        run: pytest -m "not integration" --cov=cubrid_mcp_server --cov-report=term-missing

  lowest-direct:
    # Verify the project works against the lowest versions of its direct
    # dependencies allowed by the version specifiers in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install with lowest-direct resolution
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Pytest (unit)
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start CUBRID container
        run: |
          docker run -d --name cubrid \
            --shm-size 512m \
            -e CUBRID_DB=demodb \
            -p 33000:33000 \
            -p 1523:1523 \
            cubrid/cubrid:11.2
          docker ps

      - name: Wait for CUBRID demodb to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec cubrid bash -lc "csql -u dba demodb -c 'SELECT 1;'" >/dev/null 2>&1; then
              echo "CUBRID demodb is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID demodb... attempt $i"
            sleep 5
          done
          echo "CUBRID demodb did not become ready in time"
          docker logs cubrid || true
          exit 1

      - name: Pytest (integration)
        env:
          CUBRID_HOST: 127.0.0.1
          CUBRID_PORT: "33000"
          CUBRID_USER: dba
          CUBRID_PASSWORD: ""
          CUBRID_DATABASE: demodb
        run: pytest -m integration -v

      - name: CUBRID logs (on failure)
        if: failure()
        run: docker logs cubrid || true

  changelog-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packaging
        run: pip install packaging
      - name: Lint CHANGELOG.md
        run: python scripts/lint_changelog.py

  upstream-canary:
    name: Test against pycubrid@main
    runs-on: ubuntu-latest
    continue-on-error: true
    schedule:
      - cron: "0 6 * * 1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install --force-reinstall "git+https://github.com/cubrid-lab/pycubrid.git@main"
      - run: pytest -m "not integration" -q
