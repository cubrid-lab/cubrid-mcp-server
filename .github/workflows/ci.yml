name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a PR supersedes its older run. Every non-PR run gets a
  # unique group, so main, release and scheduled runs are never cancelled and
  # never replaced while queued behind another run of the same ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tiered validation (#223). `classify` turns the event and the changed paths
  # into explicit scopes (scripts/ci_scope.py); every lane below runs only when
  # its scope is selected, and `ci-gate` requires each selected lane to succeed.
  #   docs  docs/metadata-only PR: changelog lint only, no unit job, no CUBRID
  #   pr    ordinary PR: Python 3.12 unit lane + risk-selected lanes (one default
  #         live CUBRID 11.4 lane for runtime/test changes, lowest-direct for
  #         dependency metadata, Python/CUBRID endpoints for compatibility changes)
  #   full  push to main, dispatch, or a CI-policy change: Python 3.11/3.12/3.14,
  #         CUBRID 11.2 + 11.4 and lowest-direct; a push to main runs CUBRID 11.4
  #         only (#417)
  # The full Python x CUBRID matrix runs in integration-full.yml (weekly + release).
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
      unit: ${{ steps.scope.outputs.unit }}
      python: ${{ steps.scope.outputs.python }}
      lowest: ${{ steps.scope.outputs.lowest }}
      live: ${{ steps.scope.outputs.live }}
      cubrid: ${{ steps.scope.outputs.cubrid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit; its first parent is the base tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Classify validation scopes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Diff the tested merge tree against its base. --no-renames lists both
            # sides of a move so a file leaving the runtime tree still counts;
            # core.quotePath=false keeps non-ASCII paths unquoted for matching.
            git rev-parse --verify HEAD^2 >/dev/null
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            echo "Changed paths:"
            cat "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/ci_scope.py --event "$EVENT" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### CI validation scope"
            echo '```'
            cat "$RUNNER_TEMP/scope.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify]
    if: needs.classify.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.classify.outputs.python) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Install project and dev tools
        run: |
          uv pip install --system -e . --group dev
          uv pip freeze --system

      # The Makefile is the canonical interface (#379): these targets run the same
      # commands locally and in CI. `make test` enforces fail_under and writes the
      # coverage.xml that the Codecov step uploads.
      - name: Ruff (lint)
        run: make lint

      - name: Ruff (format check)
        run: make format-check

      - name: Mypy (strict)
        run: make typecheck

      - name: Pytest (unit)
        run: make test

      - name: Publish test results summary
        if: always()
        run: python3 scripts/report_results.py step-summary --results-dir test-results/test --title "Unit tests (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-test-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  lowest-direct:
    # Verify the project works against the lowest versions of its direct
    # dependencies allowed by the version specifiers in pyproject.toml. Runs on
    # dependency-metadata PRs and on every push to main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify]
    if: needs.classify.outputs.lowest == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Install with lowest-direct resolution
        run: |
          uv pip install --system --resolution lowest-direct -e . --group dev
          uv pip freeze --system

      - name: Pytest (unit)
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify]
    if: needs.classify.outputs.live == 'true'
    strategy:
      fail-fast: false
      matrix:
        cubrid: ${{ fromJSON(needs.classify.outputs.cubrid) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Install project and dev tools
        run: |
          uv pip install --system -e . --group dev
          uv pip freeze --system

      # Starts a run-owned cubrid/cubrid container, waits for demodb, runs
      # `pytest -m integration -v`, prints the container log on failure and always
      # removes the container (scripts/run_integration.py, #379).
      - name: Pytest (integration)
        run: make integration CUBRID_VERSION=${{ matrix.cubrid }}

      - name: Publish test results summary
        if: always()
        run: python3 scripts/report_results.py step-summary --results-dir test-results/integration --title "Integration tests (CUBRID ${{ matrix.cubrid }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-integration-cubrid${{ matrix.cubrid }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  changelog-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install packaging
        run: |
          uv pip install --system packaging
          uv pip freeze --system
      - name: Lint CHANGELOG.md
        run: python scripts/lint_changelog.py

  ci-gate:
    # Single required status check that aggregates every CI job so branch
    # protection can gate merges (including Dependabot auto-merge) on one
    # stable context instead of brittle matrix-specific job names.
    #
    # Fail-closed: `classify` and `changelog-lint` must succeed, and every lane
    # must succeed unless `classify` explicitly marked it not applicable
    # (output exactly "false"). A failed, cancelled or unexpectedly skipped job,
    # or a missing classification, fails the gate.
    if: always()
    needs: [classify, lint-and-test, lowest-direct, integration, changelog-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          UNIT_RESULT: ${{ needs.lint-and-test.result }}
          UNIT_WANTED: ${{ needs.classify.outputs.unit }}
          LOWEST_RESULT: ${{ needs.lowest-direct.result }}
          LOWEST_WANTED: ${{ needs.classify.outputs.lowest }}
          LIVE_RESULT: ${{ needs.integration.result }}
          LIVE_WANTED: ${{ needs.classify.outputs.live }}
          CHANGELOG_RESULT: ${{ needs.changelog-lint.result }}
        run: |
          fail=0
          check() {
            # $1 job, $2 result, $3 "false" only when classification skips it
            if [ "$2" = "success" ]; then
              echo "ok      $1"
            elif [ "$2" = "skipped" ] && [ "$3" = "false" ]; then
              echo "skipped $1 (not applicable for tier '$TIER')"
            else
              echo "::error::$1 result '$2' (required: '$3')"
              fail=1
            fi
          }
          check classify "$CLASSIFY_RESULT" required
          check lint-and-test "$UNIT_RESULT" "$UNIT_WANTED"
          check lowest-direct "$LOWEST_RESULT" "$LOWEST_WANTED"
          check integration "$LIVE_RESULT" "$LIVE_WANTED"
          check changelog-lint "$CHANGELOG_RESULT" required
          if [ "$fail" -ne 0 ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
