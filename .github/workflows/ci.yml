name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy cubrid_mcp_server

      - name: Bandit (security)
        run: bandit -c pyproject.toml -r cubrid_mcp_server

      - name: Pytest (unit)
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start CUBRID container
        run: |
          docker run -d --name cubrid \
            --shm-size 512m \
            -p 33000:33000 \
            -p 1523:1523 \
            cubrid/cubrid:11.2
          docker ps

      - name: Wait for CUBRID broker
        run: |
          for i in $(seq 1 60); do
            if python -c "
          import socket
          s = socket.socket()
          s.settimeout(2)
          try:
              s.connect(('127.0.0.1', 33000))
              s.close()
              exit(0)
          except Exception:
              exit(1)
          " 2>/dev/null; then
              echo "CUBRID broker is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for CUBRID... attempt $i"
            sleep 5
          done
          echo "CUBRID broker did not start in time"
          docker logs cubrid || true
          exit 1

      - name: Pytest (integration)
        env:
          CUBRID_HOST: 127.0.0.1
          CUBRID_PORT: "33000"
          CUBRID_USER: dba
          CUBRID_PASSWORD: ""
          CUBRID_DATABASE: demodb
        run: pytest -m integration -v

      - name: CUBRID logs (on failure)
        if: failure()
        run: docker logs cubrid || true
